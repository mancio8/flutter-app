services:
  flutter:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: flutter-app

    working_dir: /app

    environment:
      DISPLAY: ${DISPLAY}
      LIBGL_ALWAYS_SOFTWARE: "1"

    volumes:
      # Codice sorgente
      - .:/app

      # Cache Pub persistente
      - flutter_pub_cache:/root/.pub-cache

      # .dart_tool separato dal sistema NixOS
      - flutter_dart_tool:/app/.dart_tool

      # Build Linux separata dal sistema NixOS
      - flutter_build:/app/build

      # Accesso al display X11
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    devices:
      - /dev/dri:/dev/dri

    network_mode: host

    stdin_open: true
    tty: true

volumes:
  flutter_pub_cache:
  flutter_dart_tool:
  flutter_build: